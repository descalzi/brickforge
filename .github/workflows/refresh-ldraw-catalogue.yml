name: Refresh LDraw search catalogue

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-ldraw-catalogue.yml'
      - 'scripts/build_ldraw_catalogue.py'
      - 'scripts/fetch_ldraw_library.py'
      - 'scripts/validate_ldraw_library.py'
  schedule:
    - cron: "17 3 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ldraw-catalogue-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Download the official LDraw library
        run: python scripts/fetch_ldraw_library.py
      - name: Install BrickForge geometry resolver
        run: python -m pip install -e .
      - name: Audit geometry resolution across the complete library
        run: python scripts/validate_ldraw_library.py --output ldraw-validation-report.json
      - name: Upload full-library geometry audit report
        if: always() && hashFiles('ldraw-validation-report.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: ldraw-geometry-validation-report
          path: ldraw-validation-report.json
          retention-days: 30
      - name: Resolve the current version-pinned geometry mirror
        id: mirror
        run: |
          commit="$(git ls-remote https://github.com/kulits/ldraw-parts.git refs/heads/master | cut -f1)"
          if [[ ! "$commit" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Could not resolve a full mirror commit SHA."
            exit 1
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
      - name: Build compact searchable part catalogue
        run: python scripts/build_ldraw_catalogue.py --mirror-commit "${{ steps.mirror.outputs.commit }}"
      - name: Validate generated compressed catalogue
        run: >-
          python -c "import gzip, json, pathlib;
          json.loads(gzip.decompress(pathlib.Path('docs/data/ldraw/parts-index.json.gz').read_bytes()))"
      - name: Remove superseded uncompressed catalogue
        run: rm -f docs/data/ldraw/parts-index.json
      - name: Commit catalogue update
        run: |
          git add -A docs/data/ldraw/
          if git diff --cached --quiet; then
            echo "The searchable LDraw catalogue is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh generated LDraw part search catalogue"
          git pull --rebase origin main
          git push
