name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Set up Node.js for browser code checks
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check mesh inspector JavaScript syntax
        run: node --check docs/assets/inspector.js
      - name: Check LDraw part explorer JavaScript syntax
        run: node --check docs/assets/parts.js
      - name: Run test suite
        run: python -m pytest
