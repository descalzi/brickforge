name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Set up Node.js for browser code checks
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Check mesh inspector JavaScript syntax
        run: node --check docs/assets/inspector.js
      - name: Check LDraw part explorer JavaScript syntax
        run: node --check docs/assets/parts.js
      - name: Check browser construction engine syntax
        run: node --check docs/assets/construction-engine.js && node --check docs/assets/builder.js && node --check docs/assets/footprint-worker.js && node --check docs/assets/camera-utils.js
      - name: Test browser construction, irregular footprints and camera helpers
        run: node --test tests/browser-construction.test.mjs tests/browser-footprint-corpus.test.mjs tests/browser-camera.test.mjs
      - name: Lint connection and assembly implementation and tests
        run: ruff check scripts/build_ldraw_catalogue.py tests/test_ldraw_catalogue.py src/brickforge/parts/connections.py src/brickforge/assembly src/brickforge/construction tests/test_connections.py tests/test_assembly.py
      - name: Type-check connection and assembly implementation
        run: mypy src/brickforge/parts/connections.py src/brickforge/assembly src/brickforge/construction
      - name: Verify published connection catalogue matches canonical data
        run: cmp data/connection-profiles/basic-bricks.json docs/data/connection-profiles/basic-bricks.json
      - name: Validate JSON data, schemas and example exports
        run: >-
          python -m json.tool data/connection-profiles/basic-bricks.json > /dev/null &&
          python -m json.tool docs/data/connection-profiles/basic-bricks.json > /dev/null &&
          python -m json.tool schemas/connection-profiles-v1.schema.json > /dev/null &&
          python -m json.tool schemas/assembly-graph-v1.schema.json > /dev/null &&
          python -m json.tool schemas/bom-v1.schema.json > /dev/null &&
          python -m json.tool examples/stacked-3001.assembly.json > /dev/null &&
          python -m json.tool examples/stacked-3001.bom.json > /dev/null &&
          python -m json.tool examples/block-4x4x2.assembly.json > /dev/null &&
          python -m json.tool examples/block-4x4x2.bom.json > /dev/null
      - name: Run test suite
        run: python -m pytest
