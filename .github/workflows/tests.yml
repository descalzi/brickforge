name: Describe & build engine

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python (release stamping)
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Install Chromium end-to-end test browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check browser module syntax
        run: for f in docs/assets/*.js scripts/*.mjs scripts/lib/*.js scripts/lib/*.mjs; do node --check "$f" || exit 1; done
      - name: Verify native module release and published intent schema
        run: python scripts/stamp_browser_modules.py --check && cmp schemas/object-intent-v2.schema.json docs/data/object-intent-schema-v2.json
      - name: Validate JSON data
        run: for f in $(find docs/data schemas data -name '*.json'); do python -m json.tool "$f" > /dev/null || { echo "$f"; exit 1; }; done
      - name: Unit tests
        run: node --test tests/*.test.mjs
      - name: Verify description-to-model evaluation
        run: node scripts/evaluate_intents.mjs --check
      - name: Test Describe & build studio in headless Chromium
        run: node tests/browser-studio.e2e.mjs
      - name: Retain studio screenshots and booklet
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: studio-browser-previews
          path: |
            /tmp/brickforge-studio*.png
            /tmp/brickforge-home.png
            /tmp/brickforge-mobile.png
            /tmp/brickforge-*.instructions.pdf
          if-no-files-found: ignore
          retention-days: 7
