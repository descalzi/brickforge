name: Python tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Set up Node.js for browser code checks
        uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Generate authored LEGO solid-reference STL for browser round-trip
        run: python tests/generate_golden_browser_fixture.py
      - name: Install Chromium end-to-end test browser
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check mesh inspector JavaScript syntax
        run: node --check docs/assets/inspector.js && node --check docs/assets/feature-matcher.js && node --check docs/assets/construction-preview.js && node --check docs/assets/target-grid.js && node --check docs/assets/mesh-voxelizer.js && node --check docs/assets/mesh-voxelizer-worker.js && node --check docs/assets/layered-construction-worker.js
      - name: Check LDraw part explorer JavaScript syntax
        run: node --check docs/assets/parts.js && node --check docs/assets/part-feature-worker.js && node --check docs/assets/catalogue-utils.js
      - name: Check browser construction engine syntax
        run: node --check docs/assets/construction-engine.js && node --check docs/assets/design-intent.js && node --check docs/assets/design-spec-engine.js && node --check docs/assets/builder.js && node --check docs/assets/footprint-worker.js && node --check docs/assets/camera-utils.js
      - name: Test Inspector end-to-end in Chromium
        run: node tests/browser-inspector.e2e.mjs
      - name: Test semantic design-to-assembly in headless Chromium
        run: node tests/browser-design-spec.e2e.mjs
      - name: Test browser construction, irregular footprints and camera helpers
        run: node --test tests/design-intent.test.mjs tests/design-spec-engine.test.mjs tests/browser-construction.test.mjs tests/browser-footprint-corpus.test.mjs tests/browser-camera.test.mjs tests/browser-catalogue.test.mjs tests/browser-target-grid.test.mjs tests/browser-mesh-voxelizer.test.mjs tests/browser-feature-matcher.test.mjs tests/browser-construction-preview.test.mjs tests/browser-surface-fit.test.mjs
      - name: Lint geometry, connection and assembly implementation and tests
        run: ruff check scripts/build_ldraw_catalogue.py scripts/validate_ldraw_library.py tests/test_ldraw_catalogue.py tests/test_ldraw_resolver.py tests/test_ldraw_mesh_export.py tests/compare_golden_reconstruction.py tests/generate_golden_browser_fixture.py tests/test_geometry_grid.py tests/test_mesh_voxelization.py src/brickforge/geometry/grid.py src/brickforge/geometry/voxelize.py src/brickforge/geometry/solid_reference.py src/brickforge/parts/ldraw_geometry.py src/brickforge/parts/ldraw_resolver.py src/brickforge/parts/ldraw_mesh.py src/brickforge/parts/connections.py src/brickforge/assembly src/brickforge/construction tests/test_connections.py tests/test_assembly.py
      - name: Type-check geometry, connection and assembly implementation
        run: mypy scripts/validate_ldraw_library.py src/brickforge/geometry/grid.py src/brickforge/geometry/voxelize.py src/brickforge/geometry/solid_reference.py src/brickforge/parts/ldraw_geometry.py src/brickforge/parts/ldraw_resolver.py src/brickforge/parts/connections.py src/brickforge/assembly src/brickforge/construction
      - name: Verify published connection catalogue matches canonical data
        run: cmp data/connection-profiles/basic-bricks.json docs/data/connection-profiles/basic-bricks.json
      - name: Validate JSON data, schemas and example exports
        run: >-
          python -m json.tool data/connection-profiles/basic-bricks.json > /dev/null &&
          python -m json.tool docs/data/connection-profiles/basic-bricks.json > /dev/null &&
          python -m json.tool schemas/design-intent-v1.schema.json > /dev/null &&
          python -m json.tool schemas/design-spec-v1.schema.json > /dev/null &&
          python -m json.tool docs/data/design-spec-fixtures.json > /dev/null &&
          python -m json.tool docs/data/design-intent-contracts.json > /dev/null &&
          python -m json.tool schemas/connection-profiles-v1.schema.json > /dev/null &&
          python -m json.tool schemas/assembly-graph-v1.schema.json > /dev/null &&
          python -m json.tool schemas/bom-v1.schema.json > /dev/null &&
          python -m json.tool schemas/part-feature-profile-v1.schema.json > /dev/null &&
          python -m json.tool schemas/part-feature-profile-v2.schema.json > /dev/null &&
          python -m json.tool schemas/part-feature-profile-v3.schema.json > /dev/null &&
          python -m json.tool schemas/part-feature-catalogue-v1.schema.json > /dev/null &&
          python -m json.tool schemas/part-feature-catalogue-v2.schema.json > /dev/null &&
          python -m json.tool examples/stacked-3001.assembly.json > /dev/null &&
          python -m json.tool examples/stacked-3001.bom.json > /dev/null &&
          python -m json.tool examples/block-4x4x2.assembly.json > /dev/null &&
          python -m json.tool examples/block-4x4x2.bom.json > /dev/null
      - name: Run test suite
        run: python -m pytest
      - name: Compare reconstructed LEGO geometry with authored golden model
        run: python tests/compare_golden_reconstruction.py
