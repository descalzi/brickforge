[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brickforge"
version = "0.1.0"
description = "AI-assisted generation of buildable models from LEGO elements"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary - licensing to be decided" }
dependencies = [
  "numpy>=1.26",
  "trimesh>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
]
api = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
]

[project.scripts]
brickforge-demo-assembly = "brickforge.assembly.demo:main"
brickforge-demo-block = "brickforge.construction.demo:main"

[tool.hatch.build.targets.wheel]
packages = ["src/brickforge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
